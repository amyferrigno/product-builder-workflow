  mode: dry_run
  site: "[[JIRA_SITE]]"
  project_key: "[[KEY]]"
  use_initiatives: false
  use_product_discovery: false
  components: []
  default_labels: ["agentic-pm"]
  custom_fields: {}
ux:
  output: html
  design_tokens: "[[PATH_TO_TOKENS_OR_DESIGN_SYSTEM]]"
anecdotes:
  allow_company_names: false
